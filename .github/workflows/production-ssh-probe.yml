name: Production SSH access probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install SSH password helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass

      - name: Verify pinned production host access
        shell: bash
        env:
          SSHPASS: ${{ secrets.PROD_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' '120.55.0.199 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAmiBt3Ggkqc8eAbQEeJEIHxeN+3MI9d2C9MLgBY7hoB' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=15 \
            -o NumberOfPasswordPrompts=1 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            root@120.55.0.199 \
            'set -e; test "$(id -u)" = 0; test -d /opt/rdgen; printf RDSMART_PRODUCTION_SSH_OK'
