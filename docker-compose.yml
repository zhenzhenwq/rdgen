services:
  rdgen:
    build:
      context: .
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.org/simple}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-}"
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      GHUSER: "${GHUSER}"
      GHBEARER: "${GHBEARER}"
      GENURL: "${GENURL}"
      ZIP_PASSWORD: "${ZIP_PASSWORD}"
      GHBRANCH: "${GHBRANCH:-master}"
      PROTOCOL: "${PROTOCOL:-https}"
      REPONAME: "${REPONAME:-rdgen}"
      SH_SECRET: "${SH_SECRET:-}"
      API_SHARED_SECRET: "${API_SHARED_SECRET:-}"
      SQLITE_PATH: "${SQLITE_PATH:-/opt/rdgen/data/db.sqlite3}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      HTTPS_ENABLED: "${HTTPS_ENABLED:-False}"
      SESSION_COOKIE_AGE: "${SESSION_COOKIE_AGE:-28800}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-False}"
    ports:
      - "127.0.0.1:8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
      - ./data:/opt/rdgen/data
