<header class="app-header">
    <div class="app-header__inner">
        <a class="app-brand" href="/">RustDesk 生成器</a>
        <nav class="app-nav" aria-label="主导航">
            <a href="/">生成器</a>
            {% if request.user.is_staff %}<a href="{% url 'users:list' %}">用户管理</a>{% endif %}
        </nav>
        <div class="app-account">
            <span class="app-username">{{ request.user.username }}</span>
            <a href="{% url 'users:password_change' %}">修改密码</a>
            <form class="inline-form" method="post" action="{% url 'users:logout' %}">
                {% csrf_token %}
                <button class="button button--secondary button--small" type="submit">退出</button>
            </form>
        </div>
    </div>
</header>
