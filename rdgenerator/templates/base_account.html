<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RustDesk 生成器{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --page: #f5f9ff;
            --surface: #ffffff;
            --surface-strong: #f8fbff;
            --line: #d8e7fb;
            --line-strong: #b9d3f4;
            --text: #10223d;
            --muted: #5e7190;
            --blue: #1769e0;
            --blue-strong: #0b4fb8;
            --blue-soft: #e7f1ff;
            --danger: #c92a34;
            --success: #18794e;
            --shadow: 0 18px 45px rgba(22, 81, 152, 0.10);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background:
                linear-gradient(180deg, rgba(255,255,255,.94), rgba(245,249,255,.96)),
                linear-gradient(90deg, rgba(23,105,224,.08) 1px, transparent 1px),
                linear-gradient(0deg, rgba(23,105,224,.08) 1px, transparent 1px);
            background-size: auto, 42px 42px, 42px 42px;
        }

        a { color: var(--blue-strong); font-weight: 700; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .app-header {
            border-bottom: 1px solid var(--line);
            background: rgba(255,255,255,.94);
        }

        .app-header__inner {
            display: flex;
            align-items: center;
            gap: 24px;
            width: min(1180px, calc(100% - 32px));
            min-height: 64px;
            margin: 0 auto;
        }

        .app-brand { color: var(--text); font-size: 18px; font-weight: 800; }
        .app-nav { display: flex; align-items: center; gap: 18px; }
        .app-account { display: flex; align-items: center; gap: 14px; margin-left: auto; }
        .app-username { color: var(--muted); font-size: 14px; font-weight: 700; }
        .inline-form { display: inline; margin: 0; }

        main { width: min(1180px, calc(100% - 32px)); margin: 32px auto 56px; }
        .page-heading { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
        .page-heading h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
        .page-heading__action { margin-left: auto; }

        .panel {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: linear-gradient(180deg, var(--surface), var(--surface-strong));
            box-shadow: var(--shadow);
        }

        .form-panel { width: min(600px, 100%); padding: 26px; }
        .form-panel--center { margin: 8vh auto 0; }
        .login-panel { width: min(420px, 100%); }
        .form-panel h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0; }
        .form-panel__subtitle { margin: 0 0 24px; color: var(--muted); }

        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 7px; color: var(--muted); font-weight: 700; }
        .field input {
            width: 100%;
            min-height: 44px;
            padding: 9px 11px;
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }
        .field input:focus { border-color: var(--blue); outline: 0; box-shadow: 0 0 0 4px rgba(23,105,224,.13); }
        .field--check { display: flex; align-items: center; gap: 9px; }
        .field--check input { width: 18px; min-height: 18px; accent-color: var(--blue); }
        .field--check label { margin: 0; color: var(--text); }
        .helptext { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.6; }
        .helptext ul { margin: 6px 0 0; padding-left: 20px; }
        .errorlist { margin: 6px 0; padding: 0; color: var(--danger); font-size: 14px; list-style: none; }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 9px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: linear-gradient(180deg, var(--blue), var(--blue-strong));
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
        }
        .button:hover { text-decoration: none; }
        .button--secondary { border-color: var(--line-strong); background: #fff; color: var(--blue-strong); }
        .button--danger { border-color: #f0b6bb; background: #fff; color: var(--danger); }
        .button--small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
        .form-actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; }

        .messages { margin: 0 0 18px; padding: 0; list-style: none; }
        .message { margin-bottom: 8px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
        .message.success { border-color: #a9dec7; color: var(--success); }
        .message.error { border-color: #f0b6bb; color: var(--danger); }

        .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
        th { background: var(--surface-strong); color: var(--muted); font-size: 13px; }
        tbody tr:last-child td { border-bottom: 0; }
        .row-actions { display: flex; gap: 8px; align-items: center; }
        .status { display: inline-block; padding: 3px 8px; border-radius: 6px; background: #e7f7ef; color: var(--success); font-size: 13px; font-weight: 700; }
        .status--off { background: #fdebed; color: var(--danger); }

        @media (max-width: 760px) {
            .app-header__inner { align-items: flex-start; flex-wrap: wrap; gap: 10px 16px; padding: 13px 0; }
            .app-account { width: 100%; margin-left: 0; }
            .page-heading { align-items: flex-start; flex-direction: column; }
            .page-heading__action { margin-left: 0; }
            main { margin-top: 22px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block header %}
        {% if request.user.is_authenticated %}
            {% include "includes/app_header.html" %}
        {% endif %}
    {% endblock %}
    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}<li class="message {{ message.tags }}">{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
